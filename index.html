<!DOCTYPE html>
<html>

<head>
    <meta charSet="utf-8" data-next-head="" />
    <meta name="viewport" content="width=device-width" data-next-head="" />
    <title data-next-head="">Adrian Radillo — research • bio • knowledge management</title>
    <meta name="description" content="Adrian Radillo — research, bio, knowledge management." data-next-head="" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&amp;family=Playfair+Display:wght@400;700&amp;display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #120914 0%, #090b13 100%);
            color: #e8d5f2;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }

        .Home_surface__8x0t2 {
            min-height: 100vh;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .Home_hero__g_og0 {
            text-align: center;
            padding: 40px 0;
        }

        .Home_h1__ljsaa {
            font-family: 'Playfair Display', serif;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #f0e8ff;
        }

        .Home_tagline__Jw01K {
            font-size: 24px;
            color: #c4a9ff;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .Home_tagline__Jw01K a {
            color: #c4a9ff;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .Home_tagline__Jw01K a:hover {
            color: #e8b4ff;
        }

        .Home_compactNav__N99Di {
            display: flex;
            gap: 16px;
            margin: 40px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .Home_compactNav__N99Di a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .Home_compactNav__N99Di a:hover {
            color: #a78bfa;
        }

        .Home_footer__wJNRn {
            color: #8b6fa5;
            font-size: 13px;
            margin-top: 60px;
            text-align: center;
        }

        .Home_side__3HuFA {
            margin-top: 20px;
        }

        .Home_wheelWrap__DnBu3 {
            width: 400px;
            height: 400px;
            margin: 0 auto;
            position: relative;
        }

        .Home_wheel__pAvbT {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .wheel-labels {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .wheel-label {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #ffffff;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.65);
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
            pointer-events: none;
            font-size: clamp(16px, 2.4vmin, 24px);
        }

        .wheel-label.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.02);
        }

        .wheel-label.research {
            right: 6%;
            top: 24%;
        }

        .wheel-label.bio {
            left: 50%;
            top: 80%;
        }

        .wheel-label.knowledge {
            left: 6%;
            top: 24%;
        }

        .Home_h1__ljsaa {
            font-size: 40px;
        }

        .Home_tagline__Jw01K {
            font-size: 18px;
        }

        .Home_wheelWrap__DnBu3 {
            width: 250px;
            height: 250px;
        }

        .wheel-disabled .Home_wheel__pAvbT {
            pointer-events: none;
        }

        @media (max-width: 560px) {
            .wheel-labels {
                display: none;
            }

            .Home_wheel__pAvbT {
                cursor: default;
            }
        }
    </style>
</head>

<body>
    <div id="__next">
        <div>
            <main class="Home_surface__8x0t2" role="main" aria-labelledby="site-title">
                <section class="Home_hero__g_og0" aria-label="Intro">
                    <h1 id="site-title" class="Home_h1__ljsaa">Adrian Ernesto Radillo</h1>
                    <div class="Home_tagline__Jw01K">
                        <a href="/research/">Research</a> • <a href="/bio/">Bio</a> • <a
                            href="/knowledge-management/">Knowledge Management</a>
                    </div>

                </section>
                <aside class="Home_side__3HuFA" aria-label="Interactive wheel">
                    <div class="Home_wheelWrap__DnBu3" role="application">
                        <div class="wheel-labels" aria-hidden="true">
                            <div class="wheel-label research" data-sector="Research">Research</div>
                            <div class="wheel-label bio" data-sector="Bio">Bio</div>
                            <div class="wheel-label knowledge" data-sector="Knowledge Management">Knowledge Management
                            </div>
                        </div>
                        <svg id="wheel-svg" class="Home_wheel__pAvbT" viewBox="0 0 400 400"
                            xmlns="http://www.w3.org/2000/svg" aria-label="Navigation wheel" role="img">
                            <defs>
                                <radialGradient id="g1" cx="50%" cy="40%" r="60%">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"></stop>
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.02"></stop>
                                </radialGradient>
                                <linearGradient id="g2" x1="0" x2="1">
                                    <stop offset="0%" stop-color="#c4a9ff" stop-opacity=".85"></stop>
                                    <stop offset="1" stop-color="#d480ff" stop-opacity=".8"></stop>
                                </linearGradient>
                                <linearGradient id="dragon-tint" x1="0" x2="0" y1="0" y2="1">
                                    <stop offset="0%" stop-color="rgba(0,0,0,0.06)"></stop>
                                    <stop offset="100%" stop-color="rgba(0,0,0,0.12)"></stop>
                                </linearGradient>
                            </defs>
                            <circle cx="200" cy="200" r="190" fill="url(#g1)"></circle>
                            <g transform="translate(0,0)" aria-hidden="true">
                                <defs>
                                    <clipPath id="wheel-clip">
                                        <circle cx="200" cy="200" r="190"></circle>
                                    </clipPath>
                                </defs>
                                <image href="/media/images/dragon-wheel.svg" x="20" y="20" width="360" height="360"
                                    preserveAspectRatio="xMidYMid slice" clip-path="url(#wheel-clip)" opacity="0.92">
                                </image>
                                <circle cx="200" cy="200" r="190" fill="url(#dragon-tint)" clip-path="url(#wheel-clip)">
                                </circle>
                            </g>
                            <g id="sectors" transform="translate(0,0)">
                                <path data-link="/research/" class="sector"
                                    d="M200,200 L200,10 A190,190 0 0,1 364.54,295 z" fill="url(#g2)" opacity="0.14"
                                    style="cursor:pointer;"></path>
                                <path data-link="/bio/" class="sector"
                                    d="M200,200 L364.54,295 A190,190 0 0,1 35.46,295 z" fill="url(#g2)" opacity="0.11"
                                    style="cursor:pointer;"></path>
                                <path data-link="/knowledge-management/" class="sector"
                                    d="M200,200 L35.46,295 A190,190 0 0,1 200,10 z" fill="url(#g2)" opacity="0.11"
                                    style="cursor:pointer;"></path>
                            </g>
                            <g transform="translate(0,0)">
                                <circle cx="200" cy="200" r="110" fill="rgba(255,255,255,0.02)"
                                    stroke="rgba(255,255,255,0.03)" stroke-width="1"></circle>
                            </g>
                        </svg>
                    </div>
                </aside>
                <div class="Home_footer__wJNRn">adrianradillo.org — Software Developer • Mathematician</div>
            </main>
        </div>
    </div>
    <script>
        const sectors = [
            { element: document.querySelector('[data-link="/research/"]'), label: 'Research' },
            { element: document.querySelector('[data-link="/bio/"]'), label: 'Bio' },
            { element: document.querySelector('[data-link="/knowledge-management/"]'), label: 'Knowledge Management' }
        ];

        const wheelWrap = document.querySelector('.Home_wheelWrap__DnBu3');
        const labelMap = {
            Research: document.querySelector('.wheel-label.research'),
            Bio: document.querySelector('.wheel-label.bio'),
            'Knowledge Management': document.querySelector('.wheel-label.knowledge')
        };

        const isMobile = window.matchMedia('(max-width: 560px)').matches;

        if (isMobile) {
            wheelWrap.classList.add('wheel-disabled');
        } else {
            sectors.forEach(sector => {
                if (!sector.element) return;
                const label = labelMap[sector.label];
                sector.element.addEventListener('mouseenter', () => {
                    Object.values(labelMap).forEach(el => el.classList.remove('visible'));
                    if (label) label.classList.add('visible');
                });
                sector.element.addEventListener('mouseleave', () => {
                    if (label) label.classList.remove('visible');
                });
                sector.element.addEventListener('click', () => {
                    const link = sector.element.getAttribute('data-link');
                    if (link) window.location.href = link;
                });
            });
        }
    </script>
</body>

</html>
