<body>
    <div id="__next">
        <div>
            <main class="Home_surface__8x0t2" role="main" aria-labelledby="site-title">
                <section class="Home_hero__g_og0" aria-label="Intro">
                    <h1 id="site-title" class="Home_h1__ljsaa">Adrian Ernesto Radillo</h1>
                    <div class="Home_tagline__Jw01K">
                        <a href="/research/">Research</a> • <a href="/bio/">Bio</a> • <a

                </section>
                <aside class="Home_side__3HuFA" aria-label="Interactive wheel">
                    <div class="Home_wheelWrap__DnBu3" role="application">
                        <div class="wheel-label" id="wheel-label"></div><svg id="wheel-svg" class="Home_wheel__pAvbT"
                            viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-label="Navigation wheel"
                            role="img">
                            <defs>
                                <radialGradient id="g1" cx="50%" cy="40%" r="60%">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"></stop>
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.02"></stop>
                                </radialGradient>
                                <linearGradient id="g2" x1="0" x2="1">
                                    <stop offset="0%" stop-color="#c4a9ff" stop-opacity=".85"></stop>
                                    <stop offset="1" stop-color="#d480ff" stop-opacity=".8"></stop>
                                </linearGradient>
                                <linearGradient id="dragon-tint" x1="0" x2="0" y1="0" y2="1">
                                    <stop offset="0%" stop-color="rgba(0,0,0,0.06)"></stop>
                                    <stop offset="100%" stop-color="rgba(0,0,0,0.12)"></stop>
                                </linearGradient>

                            <circle cx="200" cy="200" r="190" fill="url(#g1)"></circle>
                            <g transform="translate(0,0)" aria-hidden="true">
                                <defs>
                                    <clipPath id="wheel-clip">
                                        <circle cx="200" cy="200" r="190"></circle>
                                    </clipPath>
                                </defs>
                                <image href="/media/images/dragon-wheel.svg" x="20" y="20" width="360" height="360"
                                    preserveAspectRatio="xMidYMid slice" clip-path="url(#wheel-clip)" opacity="0.92">
                                </image>
                                <circle cx="200" cy="200" r="190" fill="url(#dragon-tint)" clip-path="url(#wheel-clip)">
                                </circle>
                            </g>
                            <g id="sectors" transform="translate(0,0)">
                                <path data-link="/research/" class="sector"
                                    d="M200,200 L200,10 A190,190 0 0,1 364.54,295 z" fill="url(#g2)" opacity="0.14"
                                    style="cursor:pointer;"></path>
                                <path data-link="/bio/" class="sector"
                                    d="M200,200 L364.54,295 A190,190 0 0,1 35.46,295 z" fill="url(#g2)" opacity="0.11"
                                    style="cursor:pointer;"></path>
                                <path data-link="/knowledge-management/" class="sector"
                                    d="M200,200 L35.46,295 A190,190 0 0,1 200,10 z" fill="url(#g2)" opacity="0.11"
                                    style="cursor:pointer;"></path>
                            </g>
                            <g transform="translate(0,0)">
                                <circle cx="200" cy="200" r="110" fill="rgba(255,255,255,0.02)"

                </aside>
                <div class="Home_footer__wJNRn">adrianradillo.org — Software Developer • Mathematician</div>
            </main>
        </div>
    </div>
    <script>
        const sectors = [
            { element: document.querySelector('[data-link="/research/"]'), label: 'Research' },
            { element: document.querySelector('[data-link="/bio/"]'), label: 'Bio' },
            { element: document.querySelector('[data-link="/knowledge-management/"]'), label: 'Knowledge Management' }
        ];
        const wheelLabel = document.getElementById('wheel-label');
        sectors.forEach(sector => {
            if (sector.element) {
                sector.element.addEventListener('mouseenter', () => {
                    wheelLabel.textContent = sector.label;
                    wheelLabel.style.opacity = '1';
                });
                sector.element.addEventListener('mouseleave', () => {
                    wheelLabel.style.opacity = '0';
                });
                sector.element.addEventListener('click', () => {
                    const link = sector.element.getAttribute('data-link');
                    if (link) window.location.href = link;
                });
            }
        });
    </script>
